<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if form.instance.pk %}Editar categoría{% else %}Registrar categoría{% endif %}</title>
</head>
<body>
    <main>
        <h1>{% if form.instance.pk %}Editar categoría{% else %}Registrar categoría{% endif %}</h1>
        <p><a href="{% url 'categoria_list' %}">Volver a categorías</a></p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar categoría</button>
            <a href="{% url 'categoria_list' %}">Cancelar</a>
        </form>
    </main>
</body>
</html>
